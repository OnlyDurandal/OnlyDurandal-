<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>for annabelle :)</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7eef2;color:#3d3037;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{width:min(91%,590px);min-height:390px;background:#fffafa;border:1px solid #eadde2;border-radius:18px;padding:30px 25px;box-shadow:0 12px 40px #6b4c5a18;text-align:center;position:relative;overflow:hidden}
h1{font-size:32px;margin:3px 0 14px}h2{font-size:25px;line-height:1.3;margin:18px 0}p{font-size:16px;line-height:1.55}.sub{font-size:13px;color:#9b858e}
button{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;transition:.25s}
.yes{background:#e889aa;color:#fff}.no{background:#eee5e9;color:#65535b}
.row{height:105px;display:flex;align-items:center;justify-content:center;gap:15px;position:relative}.bar{height:3px;background:#eadde2;margin:18px 0}.fill{height:100%;background:#e889aa;transition:.4s}
.heart{font-size:45px;margin-bottom:7px}.tiny{font-size:12px;color:#aa969e}
.float{position:absolute;pointer-events:none;animation:up 1.7s ease-out forwards;font-size:24px}@keyframes up{to{transform:translateY(-230px) rotate(18deg);opacity:0}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.08)}}
.fade{opacity:0;transform:scale(.7);pointer-events:none}
.flash{animation:flash .55s}@keyframes flash{50%{background:#fff0f5}}
.choice{margin-top:14px}.memory{background:#f9f1f4;border-radius:14px;padding:14px;margin:12px 0}.match-wrap{margin-top:15px}.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}
.desc{background:#f3e8ed;border:1px solid #e2d2d9;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer}.desc.selected{outline:2px solid #e889aa;background:#fff0f5}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.person{min-height:145px;background:#fff;border:2px dashed #e1cfd7;border-radius:14px;padding:12px;cursor:pointer}
.person h3{margin:3px 0 10px;font-size:18px}.slot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{font-size:12px;background:#f7eef2;padding:6px 8px;border-radius:8px;border:0;cursor:pointer}
.match-msg{min-height:28px;margin:10px 0;font-size:14px;color:#8d6f7b}.flip-name{animation:flipname .7s}@keyframes flipname{50%{transform:rotateY(90deg);opacity:.2}}
@media(max-width:430px){.person{min-height:125px}.desc{font-size:13px;padding:9px}}

</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const qs=[
 ["right, let's start","are you ready for this?","yes"],
 ["easy one","are you going to have a good birthday?","swap"],
 ["i'm checking something important","is kai your favourite person?","escape"],
 ["no pressure btw","will you love kai forever?","fade"],
 ["very serious question","am i allowed to call you princess forever?","grow"],
 ["think carefully","would you choose kai again?","vanish"],
 ["okay, this one might expose you","do you secretly enjoy being spoiled and getting princess treatment?","escape"],
 ["be honest...","is annabelle the most beautiful girl in the world?","beauty"],
 ["last one before things get weird","do you deserve the best birthday ever?","swap"],
 ["wait — there's one more thing","can you match these descriptions?","match"]
];
let n=-1,yesCount=0,events=0;
const app=document.getElementById("app");

function home(){
 app.innerHTML=`<div class="heart">♡</div><h1>hi princess</h1>
 <p>i made you a tiny birthday thing.</p>
 <p class="sub">it's probably a terrible idea to trust anything you see on this website.</p>
 <button class="yes" onclick="start()">okay, show me</button>`;
}
function start(){n=0;show()}
function show(){
 if(n>=qs.length){finish();return}
 const [intro,q,type]=qs[n];
 if(type==="match"){showMatch();return}
 app.innerHTML=`<div class="sub">${intro}</div><h2>${q}</h2>
 <div class="row"><button class="yes" id="yes" onclick="clickedYes()">yes</button><button class="no" id="no">no</button></div>
 <div class="bar"><div class="fill" style="width:${n/qs.length*100}%"></div></div>
 <div class="sub">page ${n+1} / ${qs.length}</div>`;
 const b=document.getElementById("no");
 if(type==="escape"){b.addEventListener("pointerenter",run);b.addEventListener("touchstart",run,{passive:false})}
 b.onclick=()=>nope(type);
}
function clickedYes(){
 yesCount++;
 const roll=Math.random();
 if(roll<.18){hearts();say("okayyy, no hesitation 😭");hold()}
 else if(roll<.34){say(["correct answer","i knew you'd say that","very good","that's what i wanted to hear","moving on..."][Math.floor(Math.random()*5)]);hold()}
 else if(roll<.48){tinySecret();hold()}
 else {next()}
}
function hold(){
 const b=document.getElementById("yes");if(!b)return;
 b.disabled=true;b.style.opacity=.65;
 setTimeout(()=>{if(n<qs.length){n++;show()}},850);
}
function next(){n++;show()}
function say(t){
 const x=document.createElement("div");x.className="tiny";x.textContent=t;
 document.querySelector(".row").after(x);
}
function hearts(){
 for(let i=0;i<8;i++){let x=document.createElement("span");x.className="float";x.textContent=["♡","♥","✦","♡"][Math.floor(Math.random()*4)];
 x.style.left=(35+Math.random()*30)+"%";x.style.top=(45+Math.random()*15)+"%";x.style.animationDelay=Math.random()*.25+"s";app.appendChild(x);setTimeout(()=>x.remove(),2100)}
}
function tinySecret(){
 const msgs=["you found absolutely nothing. well done.","secret achievement: pressing yes","this website is being held together by hope","i spent way too long making this","okay carry on :)"];
 const x=document.createElement("div");x.className="memory pop";x.textContent=msgs[Math.floor(Math.random()*msgs.length)];
 app.querySelector("h2").after(x);events++;setTimeout(()=>x.remove(),750)
}
function nope(type){
 const b=document.getElementById("no");
 if(type==="beauty"){
   b.classList.add("shake");
   b.textContent="no is not an option 😭";
   setTimeout(()=>{b.classList.remove("shake");b.textContent="yes";b.className="yes";b.onclick=clickedYes},700);
   say("the website has reviewed your answer and rejected it.");
   return;
 }
 if(type==="fade"){b.classList.add("fade");setTimeout(()=>{b.textContent="yes";b.className="yes";b.onclick=clickedYes;b.style.opacity=1;b.style.transform="none"},450)}
 else if(type==="swap"){b.textContent="yes";b.className="yes";b.onclick=clickedYes}
 else if(type==="grow"){b.style.transform="scale(.55)";setTimeout(()=>b.style.transform="scale(.2)",250);setTimeout(()=>{b.textContent="yes";b.className="yes";b.style.transform="none";b.onclick=clickedYes},650)}
 else if(type==="vanish"){b.classList.add("fade");setTimeout(()=>{b.style.display="none";say("...yeah, thought so")},300)}
 else{b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),350)}
}
function run(e){
 if(e)e.preventDefault();const b=document.getElementById("no");
 b.style.position="absolute";b.style.left=(8+Math.random()*68)+"%";b.style.top=(8+Math.random()*58)+"%";
 b.textContent=["nope","nah","nice try","not happening","erm... no"][Math.floor(Math.random()*5)];
}
const descriptions=[
 {text:"most beautiful girl on earth",good:"random"},
 {text:"sweetest girl ever",good:"random"},
 {text:"has the nicest smile",good:"random"},
 {text:"deserves princess treatment",good:"random"},
 {text:"doesn't have the nicest smile",good:"annabelle"},
 {text:"definitely isn't the sweetest girl ever",good:"annabelle"},
 {text:"probably doesn't deserve princess treatment",good:"annabelle"},
 {text:"could never be the most beautiful girl on earth",good:"annabelle"}
];
let selectedDesc=null, placed={annabelle:[],random:[]};

function showMatch(){
 app.innerHTML=`<div class="sub">okayyy one more thing 😭</div>
 <h2>match the description to the person</h2>
 <p class="tiny">put the nice ones with <b>Random girl</b> and the mean ones with <b>Annabelle</b> 👀</p>
 <div class="match-wrap">
   <div class="cards" id="cards"></div>
   <div class="people">
    <div class="person" onclick="putDesc('annabelle')">
      <h3 id="annName">Annabelle</h3><div class="slot" id="annSlot"></div>
    </div>
    <div class="person" onclick="putDesc('random')">
      <h3 id="randName">Random girl</h3><div class="slot" id="randSlot"></div>
    </div>
   </div>
   <div class="match-msg" id="matchMsg">this seems very straightforward. probably.</div>
 </div>
 <div class="bar"><div class="fill" style="width:100%"></div></div>
 <div class="sub">i'm sure this test is completely unbiased</div>`;

 const cards=document.getElementById("cards");
 descriptions.forEach((d,i)=>{
   const x=document.createElement("button");
   x.className="desc";x.textContent=d.text;x.id="d"+i;
   x.onclick=()=>selectDesc(i);
   cards.appendChild(x);
 });
}

function selectDesc(i){
 selectedDesc=i;
 document.querySelectorAll(".desc").forEach(x=>x.classList.remove("selected"));
 document.getElementById("d"+i).classList.add("selected");
 document.getElementById("matchMsg").textContent="okay, now pick a person 👀";
}

function putDesc(person){
 if(selectedDesc===null){
   document.getElementById("matchMsg").textContent="pick one of the descriptions first 😭";
   return;
 }

 const i=selectedDesc;
 if(placed.annabelle.includes(i)||placed.random.includes(i)){
   selectedDesc=null;
   return;
 }

 placed[person].push(i);
 renderMatch();
 selectedDesc=null;

 const d=descriptions[i];
 if(d.good===person){
   const msgs=[
     "yep. that one makes sense 👍",
     "fair enough 😭",
     "okay we're getting somewhere",
     "i'll allow it",
     "no complaints from me"
   ];
   document.getElementById("matchMsg").textContent=msgs[Math.floor(Math.random()*msgs.length)];
 }else{
   const msgs=[
     "hmmm... are you sure about that 😭",
     "girl what are you doing",
     "that feels slightly suspicious...",
     "i don't think the website agrees 💀",
     "you might wanna rethink that one",
     "okayyy interesting choice..."
   ];
   document.getElementById("matchMsg").textContent=msgs[Math.floor(Math.random()*msgs.length)];
 }

 if(placed.annabelle.length+placed.random.length===descriptions.length){
   setTimeout(checkMatch,500);
 }
}

function renderMatch(){
 const ann=document.getElementById("annSlot"), rnd=document.getElementById("randSlot");
 ann.innerHTML="";rnd.innerHTML="";
 placed.annabelle.forEach(i=>addChip(i,"annSlot"));
 placed.random.forEach(i=>addChip(i,"randSlot"));

 descriptions.forEach((d,i)=>{
   const card=document.getElementById("d"+i);
   const isPlaced=placed.annabelle.includes(i)||placed.random.includes(i);
   card.dataset.placed=isPlaced?"1":"";
   card.disabled=isPlaced;
   card.style.opacity=isPlaced?".35":"1";
   card.classList.remove("selected");
 });
}

function addChip(i,slot){
 const chip=document.createElement("button");
 chip.className="chip";
 chip.textContent=descriptions[i].text;
 chip.title="tap to move it";
 chip.onclick=()=>removeDesc(i);
 document.getElementById(slot).appendChild(chip);
}

function removeDesc(i){
 placed.annabelle=placed.annabelle.filter(x=>x!==i);
 placed.random=placed.random.filter(x=>x!==i);
 selectedDesc=null;
 renderMatch();
 document.getElementById("matchMsg").textContent="moved it back — have another go :)";
}

function checkMatch(){
 const allCorrect=
   descriptions.every((d,i)=>{
     if(d.good==="annabelle") return placed.annabelle.includes(i);
     return placed.random.includes(i);
   }) &&
   placed.annabelle.length===4 && placed.random.length===4;

 if(!allCorrect){
   document.getElementById("matchMsg").innerHTML="nope 😭 <b>something's in the wrong place.</b> tap a little box to move it and try again.";
   return;
 }

 document.getElementById("matchMsg").textContent="wait... actually, there's something weird here";
 setTimeout(matchFinished,900);
}

function matchFinished(){
 const ann=document.getElementById("annName"),rnd=document.getElementById("randName");
 ann.classList.add("flip-name");rnd.classList.add("flip-name");
 document.getElementById("matchMsg").textContent="ohhhhh. i see what happened 😭";
 setTimeout(()=>{
   const old=ann.textContent;
   ann.textContent=rnd.textContent;
   rnd.textContent=old;
   document.getElementById("matchMsg").innerHTML="<b>THERE WE GO 😭</b> the names were backwards the whole time.";
   hearts();
   setTimeout(()=>{n++;show()},1700);
 },800);
}

function finish(){
 app.innerHTML=`<div class="heart">♡</div><h1>okay, you made it</h1>
 <p class="sub">and yes, you were supposed to click yes every time.</p>
 <div class="memory"><b>important findings</b><br><br>you are officially allowed to have an amazing birthday.<br>kai is still your favourite person.<br>the no button has been permanently removed.</div>
 <button class="yes" onclick="finale()">there's more?</button>`;
}
function finale(){
 hearts();
 setTimeout(()=>{app.innerHTML=`<div class="heart">♡</div><h1>happy birthday, princess</h1>
 <p>okay, i'll stop messing around now.</p>
 <p>i wanted to make you something rather than just send you a normal birthday message, even if this is basically a tiny stupid website.</p>
 <p>i hope your birthday is genuinely amazing. you deserve to have the best day, get spoiled, eat something nice, and just enjoy yourself.</p>
 <p>thank you for all the little things, all the conversations, all the memories, and for being you.</p>
 <h2>love you loads :)</h2>
 <p class="tiny">p.s. yes, i rigged the entire thing.</p>`},900)
}
home();
</script>
</body>
</html>
